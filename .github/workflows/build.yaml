name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

jobs:
  build:
    name: Build (${{ matrix.os }}/ ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        compiler: [dmd, ldc, gdc-15]
        exclude:
          - os: macos-latest
            compiler: dmd
          - os: macos-latest
            compiler: gdc
          - os: windows-latest
            compiler: gdc

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Enable Debian experimental for GDC-15
        if: matrix.compiler == 'gdc-15' && startsWith(matrix.os, 'ubuntu')
        run: |
          echo "deb http://deb.debian.org/debian experimental main" | sudo tee /etc/apt/sources.list.d/experimental.list
          sudo apt update

      - name: Set up D compiler
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: ${{ matrix.compiler }}

      - name: Run tests
        run: dub test
